<ul class="list-group">
    <li *ngFor="let task of tasks" class="list-group-item">
        <div class="row">
            <div class="col-1">{{task.id}}</div>
            <div class="col-3">{{task.name}}</div>
            <div class="col-2" (click)="showDetails(task)"> <button>Show Details</button></div>
            <div class="col-2" (click)="deleteTask(task)"> <button>Delete Task</button></div>
        </div>
    </li>
</ul>

<br/>

<button class="btn btn-primary" (click)="showNewTaskDetails()">Add new task</button>

<br/>

<task-details [task]="selectorTask" (onSaveNewTask)="addNewtaskToList($event)" (onFirstFocus)="showHelp()"></task-details>
