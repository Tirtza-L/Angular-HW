<div class="card" *ngIf="task else noTask">
    <div class="card-body">
        
        <form (ngSubmit)="saveNewTask()">
            <div class="mb-3">
              <label for="name" class="form-label">Task Name:</label>
              <input type="text" class="form-control" id="name" [(ngModel)]="task.name" (focus)="inputFocus()" name="taskName">
            </div>
            
            <button type="submit" class="btn btn-primary">Save</button>
          </form>

    </div>
</div>

<ng-template #noTask> 
    <div class="card">
        no Task to display
    </div>
    <br/>
</ng-template>
